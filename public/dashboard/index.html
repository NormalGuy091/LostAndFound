<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dashboard/style.css">
     <!-- <link rel="stylesheet" href="style.css"> -->
    <title>ImperialStudent</title>
</head>
<body>
    <header class="loggedIn">
        <span id="title">ImperialStudent</span>
        <span><button onclick="logout()" id="logout-btn">Logout</button></span>
    </header>
    <section id="welcome-page">
        <span id="big-text">Lost something?</span>
        <span id="big-text-2">Let's help you find it.</span>
    </section>
    <section id="selection">
        <div class="search-row">
            <input type="search" id="search" placeholder="Search item" autocomplete="off">
            <select id="type-filter" aria-label="Filter by report type">
                <option value="">All reports</option>
                <option value="lost">Lost items</option>
                <option value="found">Found items</option>
            </select>
        </div>
        <div class="report-actions">
            <a class="reportlost" href="/lost">Report Lost Item</a>
            <a class="reportfound" href="/found">Report Found Item</a>
        </div>
    </section>
    <section id="dashboard">
        <div id="recent">Recent Reports</div>
        <p id="reports-message" class="reports-message">Loading reports...</p>
        <div class="recent-reports-container" id="reports"></div>
    </section>

    <dialog id="report-dialog">
        <button class="close-dialog" type="button" aria-label="Close">&times;</button>
        <div id="report-detail"></div>
    </dialog>

    <script src="/dashboard/script.js"></script>
</body>
