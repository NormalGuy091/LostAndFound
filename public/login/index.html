<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-wrapper">
        <section id="login-register">
            <span id="email">
                <label for="email">Email</label>
                <input type="text" name="email" class="input" id="email-input">
            </span>
            <span id="password">
                <label for="password">Password</label>
                <input type="password" name="password" class="input" id="password-input">
            </span>
            <span id="bottom">
                <span id="remember-me">
                    <label for="remember">Remember me</label>
                    <input type="checkbox" name="remember" id="">
                </span>
                <span><span id="option">Don't have an account? </span> <a href="#" id="option-btn">Register</a></span>
                <button id="login-register-btn" >Login</button>
            </span>
            
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
