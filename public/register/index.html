<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- <link rel="stylesheet" href="/register/style.css"> -->
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-wrapper">
        <section id="login-register">
            <span id="email">
                <label for="email">Email</label>
                <input type="text" name="email" class="input" id="email-input">
            </span>
            <span id="password">
                <label for="password">Password</label>
                <input type="password" name="password" class="input" id="password-input">
            </span>
            <span id="bottom">
                <span><span id="option">Already have an account? </span> <a href="http://127.0.0.1:1234/login" id="option-btn">Login</a></span>
                <button id="login-register-btn" onclick="register()">Login</button>
            </span>
            
        </section>
    </div>
    <script src="/register/script.js"></script>
</body>
</html>
