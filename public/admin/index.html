<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<header><nav>Admin Pages</nav></header>
<body>
    <div class="grid">
        <div class="show-all-data-btn btn"><button onclick="showAllData()">Show All Data</button></div>
        <div class="display"><textarea name="Data" id="displayArea"></textarea></div>
        <div class="create-user-btn btn"><button onclick="createUser()">Create a user</button></div>
        <div class="update-user-btn btn"><button>Update a user (MT)</button></div>
        <div class="delete-btn btn"><button onclick="deleteUser()"><span>Delete a user</span></button></div>
    </div>
    
    
    <script src="script.js"></script>
</body>
</html>
